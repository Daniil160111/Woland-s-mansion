<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Woland's Mansion</title>
    
    <!-- Иконка для вкладки (GitHub Pages) -->
    <link rel="icon" type="image/jpeg" href="./icon/icon.jpg">
    
    <!-- PWA Манифест -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#000000">
    
    <!-- iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Woland">
    <link rel="apple-touch-icon" href="./icon/icon.jpg">

    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: #000; color: white; 
            font-family: 'Courier New', Courier, monospace; 
            user-select: none; transition: filter 0.3s;
        }
        
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10;
        }

        /* Экран PWA для телефона (Браузер) */
        #screen-pwa-install {
            background: #111; display: none; padding: 20px; text-align: center; box-sizing: border-box;
        }
        #screen-pwa-install h1 { color: #a00; margin-bottom: 10px; }
        #screen-pwa-install p { margin: 10px 0; font-size: 16px; line-height: 1.5; color: #ccc; }
        .pwa-icon { width: 100px; height: 100px; margin-bottom: 20px; border-radius: 20px; }
        .btn-install {
            margin-top: 20px; background: #a00; color: white; border: none;
            padding: 15px 30px; font-size: 18px; font-family: inherit;
            text-transform: uppercase; cursor: pointer; border-radius: 5px;
            display: none;
        }

        /* Дисклеймер */
        #screen-disclaimer {
            background: #000; cursor: pointer; display: none;
        }
        #disclaimer-img {
            width: 100%; height: 100%; object-fit: cover;
        }

        /* Затемнение */
        #fade-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 50; pointer-events: none;
            opacity: 1; transition: opacity 1.5s ease-in-out;
        }

        /* Загрузка */
        #screen-loading {
            background: #000; z-index: 20; display: none;
        }
        .loader-text { font-size: 20px; letter-spacing: 2px; margin-bottom: 20px; }
        .progress-bar { width: 60%; max-width: 400px; height: 4px; background: #333; }
        .progress-fill { width: 0%; height: 100%; background: #a00; transition: width 0.2s; }
    </style>
</head>
<body>

    <!-- 1. Экран инструкции PWA -->
    <div id="screen-pwa-install" class="screen">
        <img src="./icon/icon.jpg" class="pwa-icon" alt="Icon">
        <h1>Установите игру</h1>
        <p>Для игры на телефоне необходимо установить веб-приложение.</p>
        <p><strong>iPhone (Safari):</strong><br>Нажмите «Поделиться» <br>и выберите «На экран "Домой"».</p>
        <p><strong>Android (Chrome):</strong><br>Нажмите на три точки в углу <br>и выберите «Установить приложение».</p>
        <button id="btn-auto-install" class="btn-install">Установить</button>
    </div>

    <!-- 2. Дисклеймер -->
    <div id="screen-disclaimer" class="screen">
        <img id="disclaimer-img" src="./Текстуры/Меню/Дисклеймер.jpg" alt="Disclaimer">
    </div>

    <!-- 3. Загрузка -->
    <div id="screen-loading" class="screen">
        <div class="loader-text">ЗАГРУЗКА ОСОБНЯКА...</div>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    </div>

    <!-- Затемнение -->
    <div id="fade-overlay"></div>

    <script type="module">
        import { Settings } from './js/settings-manager.js';
        import { Menu } from './js/menu.js';

        // --- МОДУЛЬ PLATFORM ---
        const Platform = {
            isMobile: false,
            isStandalone: false,
            deferredPrompt: null,

            init() {
                this.isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 0);
                this.isStandalone = window.matchMedia('(display-mode: fullscreen)').matches || 
                                    window.matchMedia('(display-mode: standalone)').matches || 
                                    window.navigator.standalone === true;

                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    this.deferredPrompt = e;
                    const btn = document.getElementById('btn-auto-install');
                    if (btn) btn.style.display = 'block';
                });
            },

            async lockOrientation() {
                if (this.isMobile && screen.orientation && screen.orientation.lock) {
                    try { await screen.orientation.lock('landscape'); } catch (e) {}
                }
            },

            async installPWA() {
                if (this.deferredPrompt) {
                    this.deferredPrompt.prompt();
                    await this.deferredPrompt.userChoice;
                    document.getElementById('btn-auto-install').style.display = 'none';
                    this.deferredPrompt = null;
                }
            }
        };

        Settings.init();
        Platform.init();

        const overlay = document.getElementById('fade-overlay');
        const screenPWA = document.getElementById('screen-pwa-install');
        const screenDisclaimer = document.getElementById('screen-disclaimer');
        const screenLoading = document.getElementById('screen-loading');
        const progressFill = document.getElementById('progress-fill');
        
        document.getElementById('btn-auto-install').addEventListener('click', () => Platform.installPWA());

        // --- СИСТЕМА КЭШИРОВАНИЯ ---
        // Мы используем localStorage для хранения медиа в Base64.
        // ВАЖНО: Лимит localStorage обычно 5MB. Если файлов много и они тяжелые, 
        // в будущем стоит перейти на IndexedDB, но для старта это сработает.
        const CACHE_PREFIX = 'woland_asset_';

        async function getCachedOrFetch(path) {
            const cacheKey = CACHE_PREFIX + path;
            const cachedData = localStorage.getItem(cacheKey);

            if (cachedData) {
                // Берем из кэша (возвращаем Blob)
                const res = await fetch(cachedData);
                return await res.blob();
            }

            // Если нет в кэше — качаем
            const response = await fetch(path);
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            const blob = await response.blob();

            // Сохраняем в кэш (переводим в Base64)
            const reader = new FileReader();
            reader.readAsDataURL(blob);
            reader.onloadend = () => {
                try {
                    localStorage.setItem(cacheKey, reader.result);
                } catch (e) {
                    console.warn('Кэш переполнен, файл не сохранен:', path);
                }
            };

            return blob;
        }

        // --- ЛОГИКА ЗАПУСКА ---
        if (Platform.isMobile && !Platform.isStandalone) {
            screenPWA.style.display = 'flex';
            overlay.style.opacity = '0';
        } else {
            // Предзагрузка дисклеймера (по твоему условию — он вне load.json)
            const discImg = document.getElementById('disclaimer-img');
            discImg.src = './Текстуры/Меню/Дисклеймер.jpg'; 
            
            screenDisclaimer.style.display = 'flex';
            Platform.lockOrientation();

            screenDisclaimer.addEventListener('click', () => {
                window.SoundsEngine.init();
                overlay.style.opacity = '1';
                
                setTimeout(async () => {
                    screenDisclaimer.style.display = 'none';
                    screenLoading.style.display = 'flex';
                    
                    await loadAssets();
                    
                    setTimeout(() => {
                        overlay.style.opacity = '0';
                        screenLoading.style.display = 'none';
                        Menu.start(); // Передача управления меню
                    }, 600);
                    
                }, 1500);
            });
        }

        // --- ЗАГРУЗЧИК ---
        async function loadAssets() {
            try {
                const response = await fetch('./load.json');
                const manifest = await response.json();

                let allFiles = [];
                if (manifest.sounds) allFiles = allFiles.concat(Object.entries(manifest.sounds));
                if (manifest.textures) allFiles = allFiles.concat(Object.entries(manifest.textures));

                const totalFiles = allFiles.length;
                let loadedCount = 0;

                const updateProgress = () => {
                    loadedCount++;
                    progressFill.style.width = `${Math.floor((loadedCount / totalFiles) * 100)}%`;
                };

                // Грузим звуки через движок (передаем Blob)
                if (manifest.sounds) {
                    for (const [id, path] of Object.entries(manifest.sounds)) {
                        try {
                            const blob = await getCachedOrFetch(path);
                            await window.SoundsEngine.loadSound(id, blob);
                        } catch (e) { console.warn(`Ошибка звука ${id}:`, e); }
                        updateProgress();
                    }
                }

                // Грузим текстуры (создаем объекты Image из Blob)
                if (manifest.textures) {
                    for (const [id, path] of Object.entries(manifest.textures)) {
                        try {
                            const blob = await getCachedOrFetch(path);
                            const imgUrl = URL.createObjectURL(blob);
                            // Сохраняем URL картинки, чтобы использовать её в меню
                            window.SoundsEngine.loadedTextures = window.SoundsEngine.loadedTextures || {};
                            window.SoundsEngine.loadedTextures[id] = imgUrl;
                        } catch (e) { console.warn(`Ошибка текстуры ${id}:`, e); }
                        updateProgress();
                    }
                }
                
                console.log('✅ Все ассеты загружены!');
            } catch (error) {
                console.error('Критическая ошибка загрузки:', error);
            }
        }
    </script>
</body>
</html>
