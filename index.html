<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Woland's Mansion</title>
    
    <!-- Иконка для GitHub Pages -->
    <link rel="icon" type="image/jpeg" href="./icon/icon.jpg">
    
    <!-- PWA -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="./icon/icon.jpg">

    <style>
        /* --- ПОДКЛЮЧЕНИЕ ШРИФТА --- */
        @font-face {
            font-family: 'WolandFont';
            src: url('./supermario286rusbylyajka.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: #000; color: white; 
            font-family: 'WolandFont', 'Courier New', monospace; /* Используем твой шрифт */
            user-select: none; transition: filter 0.3s;
        }
        
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10;
        }

        /* --- ЭКРАН ДЛЯ МОБИЛЬНЫХ (PWA) --- */
        #screen-pwa-install {
            background: #050505; display: none; padding: 20px; text-align: center; box-sizing: border-box;
        }
        #pwa-logo {
            width: 80%; max-width: 400px; margin-bottom: 20px;
            filter: drop-shadow(0 0 10px rgba(255,0,0,0.5));
        }
        #screen-pwa-install p { margin: 8px 0; font-size: 14px; line-height: 1.4; color: #aaa; }
        .btn-install {
            margin-top: 20px; background: #800000; color: white; border: 2px solid #f00;
            padding: 12px 24px; font-size: 16px; font-family: 'WolandFont', monospace;
            text-transform: uppercase; cursor: pointer; box-shadow: 0 0 15px rgba(255,0,0,0.4);
            display: none;
        }

        /* --- ДИСКЛЕЙМЕР --- */
        #screen-disclaimer {
            background: #000; cursor: pointer; display: none;
        }
        #disclaimer-img {
            width: 100%; height: 100%; object-fit: cover;
        }

        /* --- ЗАТЕМНЕНИЕ --- */
        #fade-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 50; pointer-events: none;
            opacity: 1; transition: opacity 1.5s ease-in-out;
        }

        /* --- ЭКРАН ЗАГРУЗКИ --- */
        #screen-loading {
            background: #000; z-index: 20; display: none;
        }
        
        /* Контейнер для 3D-вращения лица */
        .loader-3d-container {
            width: 150px; height: 150px;
            perspective: 800px;
            margin-bottom: 20px;
        }
        .loader-3d-face {
            width: 100%; height: 100%;
            object-fit: cover;
            border-radius: 50%; /* Делаем лицо круглым */
            box-shadow: 0 0 30px #500;
            animation: spin3d 4s linear infinite;
        }
        @keyframes spin3d {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        /* Анимация текста "Загрузка..." (волна) */
        .loader-text {
            font-size: 24px; letter-spacing: 3px; margin-bottom: 15px;
            display: flex; gap: 2px;
        }
        .loader-text span {
            display: inline-block;
            animation: wave 1.5s ease-in-out infinite;
        }
        /* Задержки для каждой буквы */
        .loader-text span:nth-child(1) { animation-delay: 0.0s; }
        .loader-text span:nth-child(2) { animation-delay: 0.1s; }
        .loader-text span:nth-child(3) { animation-delay: 0.2s; }
        .loader-text span:nth-child(4) { animation-delay: 0.3s; }
        .loader-text span:nth-child(5) { animation-delay: 0.4s; }
        .loader-text span:nth-child(6) { animation-delay: 0.5s; }
        .loader-text span:nth-child(7) { animation-delay: 0.6s; }
        .loader-text span:nth-child(8) { animation-delay: 0.7s; }
        .loader-text span:nth-child(9) { animation-delay: 0.8s; }
        
        @keyframes wave {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); color: #f00; }
        }

        /* Строка статуса загрузки */
        #load-status {
            font-size: 12px; color: #666; font-family: monospace;
            height: 20px; text-align: center;
        }

        /* Прогресс-бар */
        .progress-bar { width: 60%; max-width: 400px; height: 4px; background: #222; margin-top: 20px; }
        .progress-fill { width: 0%; height: 100%; background: #a00; transition: width 0.2s; box-shadow: 0 0 10px #f00; }
    </style>
</head>
<body>

    <!-- 1. Экран инструкции PWA (Только для телефонов в браузере) -->
    <div id="screen-pwa-install" class="screen">
        <img id="pwa-logo" src="./Текстуры/Меню/name1.png" alt="Woland's Mansion" onerror="this.style.display='none'">
        <p><strong>Игра не установлена</strong></p>
        <p>Для комфортной игры на телефоне (без адресной строки и в горизонтальном режиме) установите приложение.</p>
        <p style="color:#888; font-size:12px; margin-top:15px;">
            <strong>iPhone (Safari):</strong> Поделиться -> На экран "Домой"<br>
            <strong>Android (Chrome):</strong> Три точки -> Установить приложение
        </p>
        <button id="btn-auto-install" class="btn-install">Добавить приложение</button>
    </div>

    <!-- 2. Дисклеймер -->
    <div id="screen-disclaimer" class="screen">
        <img id="disclaimer-img" src="" alt="Disclaimer">
    </div>

    <!-- 3. Экран загрузки -->
    <div id="screen-loading" class="screen">
        <div class="loader-3d-container">
            <!-- Используем картинку лица. Если её нет - ничего не сломается -->
            <img class="loader-3d-face" src="./Текстуры/Воланд/лицо1.png" alt="Voland" onerror="this.src='./icon/icon.jpg'">
        </div>
        
        <div class="loader-text">
            <span>З</span><span>а</span><span>г</span><span>р</span><span>у</span><span>з</span><span>к</span><span>а</span><span>.</span><span>.</span><span>.</span>
        </div>

        <div id="load-status">Инициализация...</div>
        
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    </div>

    <!-- Затемнение -->
    <div id="fade-overlay"></div>

    <script type="module">
        import { Settings } from './js/settings-manager.js';
        import { Menu } from './js/menu.js';

        // --- МОДУЛЬ PLATFORM ---
        const Platform = {
            isMobile: false,
            isStandalone: false,
            deferredPrompt: null,

            init() {
                this.isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 0);
                this.isStandalone = window.matchMedia('(display-mode: fullscreen)').matches || 
                                    window.matchMedia('(display-mode: standalone)').matches || 
                                    window.navigator.standalone === true;

                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    this.deferredPrompt = e;
                    document.getElementById('btn-auto-install').style.display = 'block';
                });
            },

            async lockOrientation() {
                if (this.isMobile && screen.orientation && screen.orientation.lock) {
                    try { await screen.orientation.lock('landscape'); } catch (e) {}
                }
            },

            async installPWA() {
                if (this.deferredPrompt) {
                    this.deferredPrompt.prompt();
                    await this.deferredPrompt.userChoice;
                    document.getElementById('btn-auto-install').style.display = 'none';
                    this.deferredPrompt = null;
                }
            }
        };

        Settings.init();
        Platform.init();

        const overlay = document.getElementById('fade-overlay');
        const screenPWA = document.getElementById('screen-pwa-install');
        const screenDisclaimer = document.getElementById('screen-disclaimer');
        const screenLoading = document.getElementById('screen-loading');
        const progressFill = document.getElementById('progress-fill');
        const loadStatus = document.getElementById('load-status');
        const discImg = document.getElementById('disclaimer-img');
        
        document.getElementById('btn-auto-install').addEventListener('click', () => Platform.installPWA());

        // --- КЭШИРОВАНИЕ (LocalStorage) ---
        const CACHE_PREFIX = 'woland_asset_';

        async function getCachedOrFetch(path) {
            const cacheKey = CACHE_PREFIX + path;
            const cachedData = localStorage.getItem(cacheKey);
            if (cachedData) {
                const res = await fetch(cachedData);
                return await res.blob();
            }
            const response = await fetch(path);
            if (!response.ok) throw new Error(`404`);
            const blob = await response.blob();
            
            const reader = new FileReader();
            reader.readAsDataURL(blob);
            reader.onloadend = () => {
                try { localStorage.setItem(cacheKey, reader.result); } catch (e) {}
            };
            return blob;
        }

        // --- СТАРТОВАЯ ЛОГИКА ---
        
        // 1. Загружаем шрифт и дисклеймер ДО показа экрана
        async function preloadStartupAssets() {
            // Шрифт грузится через CSS, принудительно ждем его
            if (document.fonts) {
                await document.fonts.load('12px WolandFont');
            }
            
            // Грузим дисклеймер
            try {
                const blob = await getCachedOrFetch('./Текстуры/Меню/Дисклеймер.jpg');
                discImg.src = URL.createObjectURL(blob);
            } catch (e) {
                // Если дисклеймера нет, ставим заглушку, чтобы игра не крашилась
                discImg.src = './icon/icon.jpg';
            }
        }

        // 2. Главный запуск
        async function startApp() {
            await preloadStartupAssets();

            if (Platform.isMobile && !Platform.isStandalone) {
                // --- МОБИЛЬНЫЙ БРАУЗЕР ---
                screenPWA.style.display = 'flex';
                overlay.style.opacity = '0';
                
                // Грузим логотип для мобилки
                try {
                    const logoBlob = await getCachedOrFetch('./Текстуры/Меню/name1.png');
                    document.getElementById('pwa-logo').src = URL.createObjectURL(logoBlob);
                } catch(e){}

            } else {
                // --- ПК ИЛИ PWA ---
                screenDisclaimer.style.display = 'flex';
                Platform.lockOrientation();
                overlay.style.opacity = '0'; // Показываем дисклеймер

                // Ждем клика по дисклеймеру
                screenDisclaimer.addEventListener('click', () => {
                    window.SoundsEngine.init();
                    
                    // Плавное затемнение (1.5 сек)
                    overlay.style.opacity = '1';
                    
                    setTimeout(async () => {
                        screenDisclaimer.style.display = 'none';
                        screenLoading.style.display = 'flex';
                        
                        // Запускаем загрузку
                        await loadGameAssets();
                        
                        // Плавный переход в меню
                        setTimeout(() => {
                            overlay.style.opacity = '0';
                            screenLoading.style.display = 'none';
                            Menu.start();
                        }, 600);
                        
                    }, 1500); // Ждем завершения анимации затемнения
                }, { once: true }); // { once: true } чтобы не сработало дважды
            }
        }

        // 3. Загрузчик ассетов
        async function loadGameAssets() {
            try {
                const response = await fetch('./load.json');
                if (!response.ok) throw new Error('load.json не найден');
                const manifest = await response.json();

                // Собираем список всех файлов с их типами
                let queue = [];
                if (manifest.sounds) {
                    for (const [id, path] of Object.entries(manifest.sounds)) {
                        queue.push({ type: 'Звуки', id, path, target: 'sound' });
                    }
                }
                if (manifest.textures) {
                    for (const [id, path] of Object.entries(manifest.textures)) {
                        queue.push({ type: 'Текстуры', id, path, target: 'texture' });
                    }
                }

                const totalFiles = queue.length;
                let loadedCount = 0;

                // Инициализируем хранилище для текстур в движке звука (или в глобальной переменной)
                window.GameAssets = window.GameAssets || {};

                for (const item of queue) {
                    // Обновляем статус (например: "Звуки: menu_theme.mp3")
                    const fileName = item.path.split('/').pop();
                    loadStatus.textContent = `${item.type}: ${fileName}`;

                    try {
                        const blob = await getCachedOrFetch(item.path);
                        
                        if (item.target === 'sound') {
                            await window.SoundsEngine.loadSound(item.id, blob);
                        } else {
                            // Сохраняем URL текстуры в глобальный объект
                            window.GameAssets[item.id] = URL.createObjectURL(blob);
                        }
                    } catch (e) {
                        // Если файла нет — просто идем дальше (игнорируем)
                        console.warn(`Пропущен файл (не найден): ${item.path}`);
                    }

                    // Обновляем прогресс (даже если файл пропущен, мы двигаемся дальше)
                    loadedCount++;
                    progressFill.style.width = `${Math.floor((loadedCount / totalFiles) * 100)}%`;
                }

                loadStatus.textContent = "Готово!";
                console.log('✅ Загрузка завершена.');

            } catch (error) {
                console.error('Критическая ошибка загрузки:', error);
                loadStatus.textContent = "Ошибка загрузки данных.";
                // Даже если load.json битый, мы даем зайти в меню
            }
        }

        // ЗАПУСК
        startApp();

    </script>
</body>
</html>
