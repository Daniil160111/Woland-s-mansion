<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Woland's Mansion</title>
    <style>
        /* ... Твои стили остаются прежними ... */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; color: white; font-family: monospace; user-select: none; }
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
        #screen-disclaimer { background: #000; cursor: pointer; }
        #disclaimer-img { width: 100%; height: 100%; object-fit: cover; }
        #fade-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 50; pointer-events: none; opacity: 1; transition: opacity 1.5s ease-in-out; }
        #screen-loading { background: #000; z-index: 20; display: none; }
        .progress-bar { width: 60%; max-width: 400px; height: 4px; background: #333; }
        .progress-fill { width: 0%; height: 100%; background: #a00; transition: width 0.2s; }
        /* ... и так далее ... */
    </style>
</head>
<body>

    <!-- Экраны -->
    <div id="screen-disclaimer" class="screen">
        <img id="disclaimer-img" src="" alt="Disclaimer">
    </div>

    <div id="screen-loading" class="screen">
        <div class="loader-text">ЗАГРУЗКА ОСОБНЯКА...</div>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    </div>

    <div id="screen-menu" class="screen" style="display:none;">
        <img id="logo" src="" alt="Woland's Mansion">
        <div class="menu-btns">
            <button id="btn-play" class="btn">Играть</button>
        </div>
    </div>

    <div id="fade-overlay"></div>

    <!-- Подключение модулей -->
    <script type="module">
        import { Settings } from './js/settings-manager.js';
        Settings.init();

        const overlay = document.getElementById('fade-overlay');
        const screenDisclaimer = document.getElementById('screen-disclaimer');
        const screenLoading = document.getElementById('screen-loading');
        const screenMenu = document.getElementById('screen-menu');
        const progressFill = document.getElementById('progress-fill');
        const disclaimerImg = document.getElementById('disclaimer-img');

        // 1. Загрузка манифеста и ассетов
        async function loadAssets() {
            try {
                // Скачиваем список файлов
                const response = await fetch('./load.json');
                if (!response.ok) throw new Error('Не удалось загрузить load.json');
                const manifest = await response.json();

                // Собираем все пути в один массив для подсчета
                let allFiles = [];
                if (manifest.sounds) allFiles = allFiles.concat(Object.entries(manifest.sounds));
                if (manifest.textures) allFiles = allFiles.concat(Object.entries(manifest.textures));
                // Позже добавим модели и т.д.

                const totalFiles = allFiles.length;
                let loadedCount = 0;

                // Функция обновления прогресса
                const updateProgress = () => {
                    loadedCount++;
                    const percent = Math.floor((loadedCount / totalFiles) * 100);
                    progressFill.style.width = `${percent}%`;
                };

                // Загружаем звуки через движок
                if (manifest.sounds) {
                    for (const [id, path] of Object.entries(manifest.sounds)) {
                        await window.SoundsEngine.loadSound(id, path);
                        updateProgress();
                    }
                }

                // Загружаем текстуры (просто скачиваем в кэш браузера через Image)
                if (manifest.textures) {
                    for (const [id, path] of Object.entries(manifest.textures)) {
                        await new Promise((resolve) => {
                            const img = new Image();
                            img.onload = () => { updateProgress(); resolve(); };
                            img.onerror = () => { console.warn(`Ошибка текстуры: ${path}`); updateProgress(); resolve(); };
                            img.src = path;
                        });
                    }
                }

                console.log('✅ Все ассеты загружены!');
                return manifest; // Возвращаем манифест, чтобы взять оттуда пути для меню

            } catch (error) {
                console.error('Ошибка загрузки:', error);
                // Можно показать экран ошибки
            }
        }

        // 2. Старт игры
        screenDisclaimer.addEventListener('click', () => {
            // Запускаем звуковой движок
            window.SoundsEngine.init();
            
            overlay.style.opacity = '1';
            
            setTimeout(async () => {
                screenDisclaimer.style.display = 'none';
                screenLoading.style.display = 'flex';
                
                // Запускаем загрузку по манифесту
                const manifest = await loadAssets();
                
                // Как только всё загружено:
                setTimeout(() => {
                    overlay.style.opacity = '0';
                    screenLoading.style.display = 'none';
                    screenMenu.style.display = 'flex';
                    
                    // Подставляем картинки из манифеста
                    document.getElementById('logo').src = manifest.textures.menu_logo;
                    
                    // Включаем музыку
                    window.SoundsEngine.play('menu_theme', { loop: true, type: 'music' });
                    
                }, 600);
                
            }, 1500);
        });

        // Инициализация пути к дисклеймеру до клика
        // (его нужно загрузить до старта, поэтому либо хардкод, либо маленький fetch)
        disclaimerImg.src = './Текстуры/Меню/Дисклеймер.jpg'; 
        // (Или можно добавить дисклеймер в отдельный "preload" список, который грузится мгновенно)

    </script>
</body>
</html>
