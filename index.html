<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0616">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Woland's Mansion</title>
  
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon/icon.jpg" type="image/jpeg">
  <link rel="apple-touch-icon" href="./icon/icon.jpg">
  
  <style>
    @font-face {
      font-family: 'WolandFont';
      src: url('./supermario286rusbylyajka.otf') format('opentype');
      font-display: swap;
    }

    * {
      box-sizing: border-box;
      margin: 0; padding: 0;
      font-family: 'WolandFont', 'Courier New', monospace;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #050407; color: #fff;
      touch-action: none; overscroll-behavior: none;
    }

    img, canvas, video { pointer-events: none; -webkit-user-drag: none; user-drag: none; }

    .screen {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity 0.5s ease, visibility 0.5s;
      padding: max(clamp(10px, 3vmin, 40px), env(safe-area-inset-top)) 
               max(clamp(10px, 3vmin, 40px), env(safe-area-inset-right)) 
               max(clamp(10px, 3vmin, 40px), env(safe-area-inset-bottom)) 
               max(clamp(10px, 3vmin, 40px), env(safe-area-inset-left));
      text-align: center;
    }
    .screen.active { opacity: 1; visibility: visible; pointer-events: auto; }

    /* --- ЭКРАНЫ L1 И L2 --- */
    #screen-l1, #screen-l2 { background: #000; padding: 0; z-index: 200; }
    .l-image { width: 80vw; max-width: 800px; max-height: 80vh; object-fit: contain; opacity: 0; transition: opacity 1.5s ease; }
    .l-image.visible { opacity: 1; }

    /* --- ЭКРАН УСТАНОВКИ --- */
    #install-screen {
      background: radial-gradient(ellipse at center, #201020, #050407 75%);
      overflow-y: auto; justify-content: flex-start; padding-top: 5vh; z-index: 110;
    }
    .install-content { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; max-width: 600px; margin: auto 0; gap: clamp(10px, 2vh, 20px); }
    #install-screen > .install-content > img { width: min(80vw, 400px); max-height: 20vh; object-fit: contain; filter: drop-shadow(0 0 15px rgba(255,0,0,0.5)); }
    #install-screen p { color: #aaa; font-size: clamp(12px, 1.8vh, 16px); line-height: 1.5; }
    .install-card { width: 100%; padding: clamp(8px, 1.5vh, 15px) clamp(10px, 2vw, 20px); border: 1px solid #562323; border-radius: 8px; background: rgba(255,255,255,0.05); font-size: clamp(11px, 1.6vh, 14px); line-height: 1.4; text-align: left; }
    .install-card strong { color: #ff7777; display: block; margin-bottom: 4px; }
    .lang-switch { display: flex; gap: clamp(5px, 1vw, 10px); margin-top: clamp(10px, 2vh, 20px); justify-content: center; flex-wrap: wrap; }
    .lang-btn { background: transparent; color: #888; border: 1px solid #333; padding: clamp(4px, 0.8vh, 8px) clamp(8px, 1.5vw, 12px); cursor: pointer; border-radius: 5px; font-size: clamp(10px, 1.4vh, 13px); transition: all 0.4s ease; }
    .lang-btn.active { color: #fff; border-color: #f00; background: rgba(255,0,0,0.2); }
    #footer-credit { position: absolute; bottom: max(15px, env(safe-area-inset-bottom)); width: 100%; text-align: center; font-size: clamp(10px, 1.2vh, 12px); color: #555; letter-spacing: 1px; }
    .btn { padding: clamp(10px, 1.5vh, 15px) clamp(20px, 4vw, 30px); font-size: clamp(14px, 2vh, 18px); background: linear-gradient(135deg, #800000, #400000); color: #fff; border: 2px solid #f00; border-radius: 10px; cursor: pointer; box-shadow: 0 0 15px rgba(255,0,0,0.4); width: 100%; max-width: 300px; }
    #install-btn { display: none; }

    /* --- ДИСКЛЕЙМЕР --- */
    #disclaimer-screen { background: #000; cursor: pointer; z-index: 100; padding: 0; }
    #disclaimer-img { width: 100vw; height: 100vh; object-fit: cover; display: block; }

    /* --- ЗАТЕМНЕНИЕ --- */
    #fade-overlay { position: fixed; inset: 0; background: #000; z-index: 50; pointer-events: none; opacity: 0; transition: opacity 1.5s ease-in-out; }

    /* --- ЭКРАН ЗАГРУЗКИ --- */
    #loading-screen { background: #050407; z-index: 90; padding: 0; overflow: hidden; }
    
    #loading-logo {
      position: absolute; top: 8%; left: 50%; transform: translateX(-50%);
      width: min(85vw, 600px); max-height: 30vh; object-fit: contain;
    }

    .loading-center {
      display: flex; flex-direction: column; align-items: center; gap: clamp(10px, 2vh, 20px);
      width: 90%; max-width: 500px;
    }

    #loading-face {
      width: clamp(100px, 25vh, 200px); height: clamp(100px, 25vh, 200px);
      object-fit: cover; border-radius: 50%; filter: drop-shadow(0 0 20px #a00);
      animation: spin-record 4s linear infinite;
    }
    @keyframes spin-record { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    #loading-status { font-size: clamp(12px, 1.8vh, 16px); color: #aaa; min-height: 20px; text-align: center; }
    
    .progress { width: 100%; height: clamp(6px, 1vh, 10px); overflow: hidden; background: #222; border-radius: 5px; direction: ltr; }
    #progress-fill { width: 0%; height: 100%; background: #a00; transition: width 0.3s ease; box-shadow: 0 0 10px #f00; float: left; }

    #game-container { position: fixed; inset: 0; z-index: 10; display: none; }
    #game-container.active { display: block; }
  </style>
</head>
<body>

  <!-- 0. ЭКРАНЫ L1 И L2 -->
  <section id="screen-l1" class="screen">
    <img id="img-l1" class="l-image" src="./Текстуры/Меню/L1.jpg" alt="L1" onerror="this.style.display='none';">
  </section>
  <section id="screen-l2" class="screen">
    <img id="img-l2" class="l-image" src="./Текстуры/Меню/l2.jpg" alt="L2" onerror="this.style.display='none';">
  </section>

  <!-- 1. ЭКРАН УСТАНОВКИ -->
  <section id="install-screen" class="screen">
    <div class="install-content">
      <img src="./Текстуры/Меню/Название.jpg" alt="Woland's Mansion" onerror="this.hidden=true">
      <p data-i18n="install_hint">Для комфортной игры на телефоне установите приложение.</p>
      <div class="install-card">
        <strong data-i18n="ios_title">iPhone / iPad (Safari)</strong>
        <span data-i18n="ios_text">Поделиться → На экран "Домой"</span>
      </div>
      <div class="install-card">
        <strong data-i18n="android_title">Android (Chrome / Samsung)</strong>
        <span data-i18n="android_text">Меню (⋮) → Установить приложение</span>
      </div>
      <button id="install-btn" class="btn" data-i18n="install_btn">Установить приложение</button>
      <div class="lang-switch">
        <button class="lang-btn active" data-lang="ru">RU</button>
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="fr">FR</button>
        <button class="lang-btn" data-lang="es">ES</button>
        <button class="lang-btn" data-lang="it">IT</button>
      </div>
    </div>
    <div id="footer-credit">HTML Gaming 2026</div>
  </section>

  <!-- 2. ДИСКЛЕЙМЕР -->
  <section id="disclaimer-screen" class="screen">
    <img id="disclaimer-img" src="./Текстуры/Меню/Дисклеймер.jpg" alt="Disclaimer" onerror="this.style.display='none';">
  </section>

  <!-- 3. ЗАГРУЗКА -->
  <section id="loading-screen" class="screen">
    <img id="loading-logo" src="./Текстуры/Меню/Название.jpg" alt="Woland's Mansion" onerror="this.hidden=true">
    
    <div class="loading-center">
      <!-- Вращающийся Воланд -->
      <img id="loading-face" src="./Текстуры/Воланд/Воланд_глаза_открыты.png" alt="" onerror="this.hidden=true;">
      <div id="loading-status">Подготовка...</div>
      <div class="progress"><div id="progress-fill"></div></div>
    </div>
  </section>

  <!-- 4. КОНТЕЙНЕР ДЛЯ ИГРЫ -->
  <div id="game-container"></div>
  <div id="fade-overlay"></div>

  <script type="module">
    'use strict';

    // ★ ЗАЩИТА
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('dragstart', e => e.preventDefault());
    document.addEventListener('selectstart', e => e.preventDefault());
    document.addEventListener('copy', e => e.preventDefault());
    document.addEventListener('cut', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey && ['c','s','u'].includes(e.key.toLowerCase())) || e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I')) e.preventDefault();
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
    }

    const $ = id => document.getElementById(id);

    // ★ ПЕРЕВОДЫ
    const translations = {
      ru: { install_hint: "Для комфортной игры на телефоне установите приложение.", ios_title: "iPhone / iPad (Safari)", ios_text: "Поделиться → На экран 'Домой'", android_title: "Android (Chrome / Samsung)", android_text: "Меню (⋮) → Установить приложение", install_btn: "Установить приложение" },
      en: { install_hint: "For the best experience on mobile, install the app.", ios_title: "iPhone / iPad (Safari)", ios_text: "Share → Add to Home Screen", android_title: "Android (Chrome / Samsung)", android_text: "Menu (⋮) → Install app", install_btn: "Install App" },
      fr: { install_hint: "Pour une meilleure expérience, installez l'application.", ios_title: "iPhone / iPad (Safari)", ios_text: "Partager → Sur l'écran d'accueil", android_title: "Android (Chrome / Samsung)", android_text: "Menu (⋮) → Installer l'application", install_btn: "Installer l'App" },
      es: { install_hint: "Para una mejor experiencia, instala la aplicación.", ios_title: "iPhone / iPad (Safari)", ios_text: "Compartir → Añadir a pantalla de inicio", android_title: "Android (Chrome / Samsung)", android_text: "Menú (⋮) → Instalar aplicación", install_btn: "Instalar App" },
      it: { install_hint: "Per un'esperienza migliore, installa l'app.", ios_title: "iPhone / iPad (Safari)", ios_text: "Condividi → Aggiungi alla schermata Home", android_title: "Android (Chrome / Samsung)", android_text: "Menu (⋮) → Installa app", install_btn: "Installa App" }
    };

    let currentLang = 'ru';
    async function setLanguage(lang, force = false) {
      if (currentLang === lang && !force) return;
      currentLang = lang;
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.lang === lang));
      const elements = document.querySelectorAll('[data-i18n]');
      elements.forEach(el => { el.style.opacity = '0'; });
      await new Promise(r => setTimeout(r, 250));
      elements.forEach(el => {
        const key = el.dataset.i18n;
        if (translations[lang][key]) el.innerHTML = translations[lang][key];
        el.style.opacity = '1';
      });
    }
    document.querySelectorAll('.lang-btn').forEach(btn => btn.addEventListener('click', () => setLanguage(btn.dataset.lang)));

    function isPWA() {
      return window.matchMedia('(display-mode: standalone)').matches || window.matchMedia('(display-mode: fullscreen)').matches || window.navigator.standalone === true;
    }
    function isMobile() {
      return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 0 && matchMedia('(pointer: coarse)').matches);
    }

    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault(); deferredPrompt = e; $('install-btn').style.display = 'inline-block';
    });
    $('install-btn').addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; $('install-btn').style.display = 'none';
      }
    });

    const activateScreen = (id) => {
      document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
      if (id) $(id).classList.add('active');
    };

    // ★ НОВЫЙ ЗАПУСК: L1 -> L2 -> Дисклеймер
    async function startApp() {
      if (isMobile() && !isPWA()) {
        activateScreen('install-screen');
        setLanguage('ru', true);
        return;
      }

      const imgL1 = $('img-l1');
      const imgL2 = $('img-l2');
      const fade = $('fade-overlay');

      // L1
      activateScreen('screen-l1');
      fade.style.transition = 'none'; fade.style.opacity = '0';
      if (imgL1) { imgL1.classList.add('visible'); }

      await new Promise(r => setTimeout(r, 5000)); // 5 секунд

      // Затемнение 1.5с
      fade.style.transition = 'opacity 1.5s ease';
      fade.style.opacity = '1';
      await new Promise(r => setTimeout(r, 1500));

      // L2
      activateScreen('screen-l2');
      if (imgL2) { imgL2.classList.add('visible'); }
      fade.style.opacity = '0';
      
      await new Promise(r => setTimeout(r, 2500));

      // L2 исчезает 1.5с
      if (imgL2) { imgL2.classList.remove('visible'); }
      await new Promise(r => setTimeout(r, 1500));

      activateScreen('disclaimer-screen');
    }

    $('disclaimer-screen').addEventListener('click', async () => {
      const fade = $('fade-overlay');
      fade.style.transition = 'opacity 1.5s ease-in-out';
      fade.style.opacity = '1';
      await new Promise(r => setTimeout(r, 1500));

      activateScreen('loading-screen');
      await new Promise(r => setTimeout(r, 500));
      fade.style.opacity = '0';

      try {
        await import('./Фон/settings-manager.js').then(m => m.Settings.init()).catch(() => {});
        await import('./Фон/sounds.js').catch(() => {});
        if (window.SoundsEngine) window.SoundsEngine.init();

        await loadAssets();

        const menuModule = await import('./Блоки/menu.js');
        if (menuModule && menuModule.Menu) {
          await menuModule.Menu.start('title');
        }

        fade.style.transition = 'opacity 1s ease-in-out';
        fade.style.opacity = '1';
        await new Promise(r => setTimeout(r, 1000));
        
        activateScreen(null);
        $('game-container').classList.add('active');
        fade.style.opacity = '0';

      } catch (err) {
        console.error('Критическая ошибка:', err);
        $('loading-status').textContent = 'Ошибка загрузки. Проверьте консоль.';
      }
    }, { once: true });

    // ★ ЗАГРУЗЧИК (Кэш через Service Worker)
    async function loadAssets() {
      const status = $('loading-status');
      const progress = $('progress-fill');
      
      try {
        const resp = await fetch('./load.json');
        if (!resp.ok) throw new Error('load.json не найден');
        const manifest = await resp.json();

        const queue = [
          ...Object.entries(manifest.sounds || {}).map(([id, url]) => ({ id, url, type: 'Звуки' })),
          ...Object.entries(manifest.textures || {}).map(([id, url]) => ({ id, url, type: 'Текстуры' }))
        ];

        const total = queue.length;
        let loaded = 0;
        let totalBytes = 0;
        let loadedBytes = 0;
        window.GameAssets = window.GameAssets || {};

        // Считаем общий вес
        for (const item of queue) {
          try {
            const head = await fetch(item.url, { method: 'HEAD' });
            const size = parseInt(head.headers.get('Content-Length') || '0', 10);
            totalBytes += size;
          } catch (e) {}
        }

        for (const item of queue) {
          status.textContent = `Загрузка: ${item.type} [${loaded + 1}/${total}] (${(loadedBytes / 1024 / 1024).toFixed(1)} / ${(totalBytes / 1024 / 1024).toFixed(1)} МБ)`;
          
          try {
            const res = await fetch(item.url);
            if (!res.ok) throw new Error('404');
            const blob = await res.blob();
            loadedBytes += blob.size;

            if (item.type === 'Текстуры') {
              window.GameAssets[item.id] = URL.createObjectURL(blob);
            } else if (window.SoundsEngine) {
              await window.SoundsEngine.loadSound(item.id, blob);
            }
          } catch (e) {
            console.warn(`[Пропуск] ${item.url}`);
          }
          
          loaded++;
          const percent = totalBytes > 0 ? Math.round((loadedBytes / totalBytes) * 100) : Math.round((loaded / total) * 100);
          progress.style.width = `${percent}%`;
        }
        status.textContent = 'Ресурсы готовы!';
      } catch (e) {
        console.warn('Ошибка манифеста:', e);
        status.textContent = 'Пропуск ассетов...';
        progress.style.width = '100%';
      }
    }

    startApp();
  </script>
</body>
</html>
