<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0616">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Woland's Mansion</title>
  
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon/icon.jpg" type="image/jpeg">
  <link rel="apple-touch-icon" href="./icon/icon.jpg">
  
  <style>
    @font-face {
      font-family: 'WolandFont';
      src: url('./supermario286rusbylyajka.otf') format('opentype');
      font-display: swap;
    }

    * {
      box-sizing: border-box;
      margin: 0; padding: 0;
      font-family: 'WolandFont', 'Courier New', monospace;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #050407; color: #fff;
      touch-action: none;
      overscroll-behavior: none;
    }

    img, canvas, video {
      pointer-events: none;
      -webkit-user-drag: none;
      user-drag: none;
    }

    .screen {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity 0.5s ease, visibility 0.5s;
      padding: max(clamp(10px, 3vmin, 40px), env(safe-area-inset-top)) 
               max(clamp(10px, 3vmin, 40px), env(safe-area-inset-right)) 
               max(clamp(10px, 3vmin, 40px), env(safe-area-inset-bottom)) 
               max(clamp(10px, 3vmin, 40px), env(safe-area-inset-left));
      text-align: center;
    }
    .screen.active { opacity: 1; visibility: visible; pointer-events: auto; }

    /* --- ЭКРАН УСТАНОВКИ --- */
    #install-screen {
      background: radial-gradient(ellipse at center, #201020, #050407 75%);
      overflow-y: auto; justify-content: flex-start; padding-top: 5vh; z-index: 110;
    }
    .install-content {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 100%; max-width: 600px; margin: auto 0; gap: clamp(10px, 2vh, 20px);
    }
    #install-screen > .install-content > img {
      width: min(80vw, 400px); max-height: 20vh; object-fit: contain;
      filter: drop-shadow(0 0 15px rgba(255,0,0,0.5));
    }
    #install-screen p { color: #aaa; font-size: clamp(12px, 1.8vh, 16px); line-height: 1.5; }
    .install-card {
      width: 100%; padding: clamp(8px, 1.5vh, 15px) clamp(10px, 2vw, 20px);
      border: 1px solid #562323; border-radius: 8px; background: rgba(255,255,255,0.05);
      font-size: clamp(11px, 1.6vh, 14px); line-height: 1.4; text-align: left;
    }
    .install-card strong { color: #ff7777; display: block; margin-bottom: 4px; }
    .lang-switch { display: flex; gap: clamp(5px, 1vw, 10px); margin-top: clamp(10px, 2vh, 20px); justify-content: center; flex-wrap: wrap; }
    .lang-btn {
      background: transparent; color: #888; border: 1px solid #333;
      padding: clamp(4px, 0.8vh, 8px) clamp(8px, 1.5vw, 12px); 
      cursor: pointer; border-radius: 5px; font-size: clamp(10px, 1.4vh, 13px);
      transition: all 0.4s ease;
    }
    .lang-btn.active { color: #fff; border-color: #f00; background: rgba(255,0,0,0.2); }
    #footer-credit {
      position: absolute; bottom: max(15px, env(safe-area-inset-bottom)); 
      width: 100%; text-align: center; font-size: clamp(10px, 1.2vh, 12px); color: #555; letter-spacing: 1px;
    }
    .btn {
      padding: clamp(10px, 1.5vh, 15px) clamp(20px, 4vw, 30px); font-size: clamp(14px, 2vh, 18px);
      background: linear-gradient(135deg, #800000, #400000); color: #fff;
      border: 2px solid #f00; border-radius: 10px; cursor: pointer;
      box-shadow: 0 0 15px rgba(255,0,0,0.4); width: 100%; max-width: 300px;
    }
    #install-btn { display: none; }

    /* --- ДИСКЛЕЙМЕР --- */
    #disclaimer-screen { 
      background: #000; cursor: pointer; z-index: 100; padding: 0; 
    }
    #disclaimer-img { 
      width: 100vw; height: 100vh; object-fit: cover; display: block; 
    }

    /* --- ЗАТЕМНЕНИЕ --- */
    #fade-overlay {
      position: fixed; inset: 0; background: #000; z-index: 50;
      pointer-events: none; opacity: 0; transition: opacity 1.5s ease-in-out;
    }

    /* --- ЭКРАН ЗАГРУЗКИ --- */
    #loading-screen { background: #050407; z-index: 90; padding: 0; overflow: hidden; }
    
    #loading-logo {
      position: absolute; top: 10%; left: 50%; transform: translateX(-50%);
      width: min(70vw, 400px); max-height: 25vh; object-fit: contain;
      filter: drop-shadow(0 0 20px rgba(255,0,0,0.6));
    }

    .loading-corner {
      position: absolute; bottom: max(25px, env(safe-area-inset-bottom)); right: max(25px, env(safe-area-inset-right));
      display: flex; flex-direction: column; align-items: flex-end; gap: clamp(8px, 1.5vh, 15px); text-align: right;
    }
    #loading-face {
      width: clamp(50px, 12vh, 100px); height: clamp(50px, 12vh, 100px);
      object-fit: cover; border-radius: 50%; filter: drop-shadow(0 0 10px #a00);
      animation: spin-record 4s linear infinite;
    }
    @keyframes spin-record { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* Последовательная волна текста (одна волна за другой) */
    .loader-title {
      display: flex; gap: 3px; font-size: clamp(20px, 4vh, 36px); letter-spacing: 2px; text-shadow: 0 0 12px #f00;
    }
    .loader-title span {
      display: inline-block;
      animation: wave-sequence 1.8s infinite linear;
    }
    @keyframes wave-sequence {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.3; text-shadow: none; }
      20% { transform: translateY(-12px); opacity: 1; color: #f00; text-shadow: 0 0 10px rgba(255,0,0,0.8); }
    }

    #loading-status { font-size: clamp(10px, 1.5vh, 14px); color: #aaa; min-height: 20px; max-width: 60vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    /* Полоска загрузки строго слева направо */
    .progress { width: min(60vw, 300px); height: clamp(4px, 0.8vh, 8px); overflow: hidden; background: #222; border-radius: 5px; direction: ltr; }
    #progress-fill { width: 0%; height: 100%; background: #a00; transition: width 0.3s ease; box-shadow: 0 0 10px #f00; float: left; }

    #game-container { position: fixed; inset: 0; z-index: 10; display: none; }
    #game-container.active { display: block; }
  </style>
</head>
<body>

  <!-- 1. ЭКРАН УСТАНОВКИ -->
  <section id="install-screen" class="screen">
    <div class="install-content">
      <img src="./Текстуры/Меню/name1.png" alt="Woland's Mansion" onerror="this.hidden=true">
      <p data-i18n="install_hint">Для комфортной игры на телефоне установите приложение.</p>
      <div class="install-card">
        <strong data-i18n="ios_title">iPhone / iPad (Safari)</strong>
        <span data-i18n="ios_text">Поделиться → На экран "Домой"</span>
      </div>
      <div class="install-card">
        <strong data-i18n="android_title">Android (Chrome / Samsung)</strong>
        <span data-i18n="android_text">Меню (⋮) → Установить приложение</span>
      </div>
      <button id="install-btn" class="btn" data-i18n="install_btn">Установить приложение</button>
      <div class="lang-switch">
        <button class="lang-btn active" data-lang="ru">RU</button>
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="fr">FR</button>
        <button class="lang-btn" data-lang="es">ES</button>
        <button class="lang-btn" data-lang="it">IT</button>
      </div>
    </div>
    <div id="footer-credit">HTML Gaming 2026</div>
  </section>

  <!-- 2. ДИСКЛЕЙМЕР -->
  <section id="disclaimer-screen" class="screen">
    <img id="disclaimer-img" src="./Текстуры/Меню/Дисклеймер.jpg" alt="Disclaimer" onerror="this.style.display='none';">
  </section>

  <!-- 3. ЗАГРУЗКА -->
  <section id="loading-screen" class="screen">
    <!-- Логотип при загрузке теперь на месте и виден -->
    <img id="loading-logo" src="./Текстуры/Меню/name1.png" alt="Woland's Mansion" onerror="this.hidden=true">
    
    <div class="loading-corner">
      <img id="loading-face" src="./Текстуры/Воланд/лицо1.png" alt="" onerror="this.hidden=true;">
      
      <div class="loader-title" id="loader-title" aria-label="Загрузка"></div>
      
      <div id="loading-status">Подготовка...</div>
      <div class="progress"><div id="progress-fill"></div></div>
    </div>
  </section>

  <!-- 4. КОНТЕЙНЕР ДЛЯ ИГРЫ -->
  <div id="game-container"></div>
  <div id="fade-overlay"></div>

  <script type="module">
    'use strict';

    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('dragstart', e => e.preventDefault());
    document.addEventListener('selectstart', e => e.preventDefault());
    document.addEventListener('copy', e => e.preventDefault());
    document.addEventListener('cut', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey && ['c','s','u'].includes(e.key.toLowerCase())) || e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I')) {
        e.preventDefault();
      }
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
    }

    const $ = id => document.getElementById(id);

    // Генерация последовательной волны для слова "Загрузка..."
    const textContainer = $('loader-title');
    const loadingText = "Загрузка...";
    [...loadingText].forEach((char, index) => {
      const span = document.createElement('span');
      span.textContent = char;
      // Каждая буква начинает прыгать ровно после предыдущей, создавая волну друг за другом
      span.style.animationDelay = `${index * 0.12}s`;
      textContainer.appendChild(span);
    });

    const translations = {
      ru: { install_hint: "Для комфортной игры на телефоне установите приложение.", ios_title: "iPhone / iPad (Safari)", ios_text: "Поделиться → На экран 'Домой'", android_title: "Android (Chrome / Samsung)", android_text: "Меню (⋮) → Установить приложение", install_btn: "Установить приложение" },
      en: { install_hint: "For the best experience on mobile, install the app.", ios_title: "iPhone / iPad (Safari)", ios_text: "Share → Add to Home Screen", android_title: "Android (Chrome / Samsung)", android_text: "Menu (⋮) → Install app", install_btn: "Install App" },
      fr: { install_hint: "Pour une meilleure expérience, installez l'application.", ios_title: "iPhone / iPad (Safari)", ios_text: "Partager → Sur l'écran d'accueil", android_title: "Android (Chrome / Samsung)", android_text: "Menu (⋮) → Installer l'application", install_btn: "Installer l'App" },
      es: { install_hint: "Para una mejor experiencia, instala la aplicación.", ios_title: "iPhone / iPad (Safari)", ios_text: "Compartir → Añadir a pantalla de inicio", android_title: "Android (Chrome / Samsung)", android_text: "Menú (⋮) → Instalar aplicación", install_btn: "Instalar App" },
      it: { install_hint: "Per un'esperienza migliore, installa l'app.", ios_title: "iPhone / iPad (Safari)", ios_text: "Condividi → Aggiungi alla schermata Home", android_title: "Android (Chrome / Samsung)", android_text: "Menu (⋮) → Installa app", install_btn: "Installa App" }
    };

    let currentLang = 'ru';
    async function setLanguage(lang, force = false) {
      if (currentLang === lang && !force) return;
      currentLang = lang;
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.lang === lang));
      const elements = document.querySelectorAll('[data-i18n]');
      elements.forEach(el => { el.style.opacity = '0'; });
      await new Promise(r => setTimeout(r, 250));
      elements.forEach(el => {
        const key = el.dataset.i18n;
        if (translations[lang][key]) el.innerHTML = translations[lang][key];
        el.style.opacity = '1';
      });
    }

    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', () => setLanguage(btn.dataset.lang));
    });

    function isPWA() {
      return window.matchMedia('(display-mode: standalone)').matches || 
             window.matchMedia('(display-mode: fullscreen)').matches || 
             window.matchMedia('(display-mode: minimal-ui)').matches || 
             window.navigator.standalone === true;
    }

    function isMobile() {
      return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 0 && matchMedia('(pointer: coarse)').matches);
    }

    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      $('install-btn').style.display = 'inline-block';
    });

    $('install-btn').addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        $('install-btn').style.display = 'none';
      }
    });

    const activateScreen = (id) => {
      document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
      if (id) $(id).classList.add('active');
    };

    function startApp() {
      if (isMobile() && !isPWA()) {
        activateScreen('install-screen');
        setLanguage('ru', true);
      } else {
        activateScreen('disclaimer-screen');
      }
    }

    $('disclaimer-screen').addEventListener('click', async () => {
      const fade = $('fade-overlay');
      fade.style.opacity = '1';
      await new Promise(r => setTimeout(r, 1500));

      activateScreen('loading-screen');
      await new Promise(r => setTimeout(r, 500));
      fade.style.opacity = '0';

      try {
        await import('./Фон/settings-manager.js').then(m => m.Settings.init()).catch(() => {});
        await import('./Фон/sounds.js').catch(() => {});
        if (window.SoundsEngine) window.SoundsEngine.init();

        await loadAssets();

        try {
          const menuModule = await import('./Блоки/menu.js');
          if (menuModule && menuModule.Menu && typeof menuModule.Menu.start === 'function') {
            await menuModule.Menu.start('title');
          } else {
            console.warn('Метод Menu.start не найден');
          }
        } catch (menuErr) {
          console.error('Ошибка в menu.js:', menuErr);
          $('loading-status').textContent = 'Ошибка загрузки меню';
          return;
        }

        fade.style.opacity = '1';
        await new Promise(r => setTimeout(r, 1000));
        
        activateScreen(null);
        $('game-container').classList.add('active');
        fade.style.opacity = '0';

      } catch (err) {
        console.error('Критическая ошибка:', err);
        $('loading-status').textContent = 'Ошибка загрузки. Проверьте консоль.';
      }
    }, { once: true });

    // Загрузка ассетов с честной пропорциональной полосой слева направо
    async function loadAssets() {
      const status = $('loading-status');
      const progress = $('progress-fill');
      try {
        const resp = await fetch('./load.json');
        if (!resp.ok) throw new Error('load.json не найден');
        const manifest = await resp.json();

        const queue = [
          ...Object.entries(manifest.sounds || {}).map(([id, url]) => ({ id, url, type: 'Звуки' })),
          ...Object.entries(manifest.textures || {}).map(([id, url]) => ({ id, url, type: 'Текстуры' }))
        ];

        let loaded = 0;
        const total = queue.length;
        window.GameAssets = window.GameAssets || {};

        for (const item of queue) {
          const fileName = item.url.split('/').pop();
          status.textContent = `Скачивание [${loaded + 1}/${total}] ${item.type}: ${fileName}`;
          try {
            const blob = await (await fetch(item.url)).blob();
            if (item.type === 'Текстуры') {
              window.GameAssets[item.id] = URL.createObjectURL(blob);
            } else if (window.SoundsEngine) {
              await window.SoundsEngine.loadSound(item.id, blob);
            }
          } catch (e) {
            console.warn(`[Пропуск] ${item.url}`);
          }
          loaded++;
          // Точный расчет процентов слева направо без искажений
          const percent = Math.round((loaded / total) * 100);
          progress.style.width = `${percent}%`;
        }
        status.textContent = 'Ресурсы готовы!';
      } catch (e) {
        status.textContent = 'Пропуск ассетов...';
        progress.style.width = '100%';
      }
    }

    startApp();
  </script>
</body>
</html>
