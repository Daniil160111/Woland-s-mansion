name: Deploy Woland's Mansion from Zip

on:
  push:
    branches:
      - main  # Если ваша главная ветка называется master, замените main на master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip content
        run: |
          mkdir public
          # Распаковываем конкретный архив
          unzip -o "Woland's mansion ver 0.5.0.zip" -d public/
          
          # Если внутри ZIP файлы лежали в подпапке, перемещаем всё в корень public/
          if [ ! -f public/index.html ]; then
            INNER_DIR=$(find public -maxdepth 1 -mindepth 1 -type d | head -n 1)
            if [ -n "$INNER_DIR" ]; then
              echo "Moving files from inner directory: $INNER_DIR"
              shopt -s dotglob
              mv "$INNER_DIR"/* public/ 2>/dev/null || true
              rm -rf "$INNER_DIR"
            fi
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
